---
description: A single file or sub-gallery entry in a file gallery listing.
type: object
required:
  - isgal
  - id
  - parentId
  - name
  - description
  - size
  - created
  - filename
  - type
  - creator
  - author
  - hits
  - lastDownload
  - votes
  - points
  - path
  - reference_url
  - is_reference
  - hash
  - search_data
  - metadata
  - lastModif
  - last_user
  - lockedby
  - comment
  - deleteAfter
  - maxhits
  - archiveId
  - ocr_state
  - visible
  - public
  - fileId
  - galleryId
  - filesize
  - filetype
  - user
  - lastModifUser
  - icon_fileId
  - perms
  - podcast_filename
properties:
  isgal:
    type: integer
    description: "1 if this entry is a sub-gallery, 0 if it is a file."
  id:
    type: integer
  parentId:
    type: integer
  name:
    type: string
  description:
    type: string
    nullable: true
  size:
    type: integer
    nullable: true
  created:
    type: integer
    nullable: true
  filename:
    type: string
    nullable: true
  type:
    type: string
    nullable: true
  creator:
    type: string
    nullable: true
  author:
    type: string
    nullable: true
  hits:
    type: integer
    nullable: true
  lastDownload:
    type: integer
    nullable: true
  votes:
    type: integer
    nullable: true
  points:
    oneOf:
      - type: number
      - type: string
    nullable: true
  path:
    type: string
    nullable: true
  reference_url:
    type: string
    nullable: true
  is_reference:
    type: string
    nullable: true
  hash:
    type: string
    nullable: true
  search_data:
    type: string
    nullable: true
  metadata:
    type: string
    nullable: true
  lastModif:
    type: integer
    nullable: true
  last_user:
    type: string
    nullable: true
  lockedby:
    type: string
    nullable: true
  comment:
    type: string
    nullable: true
  deleteAfter:
    oneOf:
      - type: integer
      - type: string
    nullable: true
  maxhits:
    oneOf:
      - type: integer
      - type: string
    nullable: true
  archiveId:
    type: integer
    nullable: true
  ocr_state:
    oneOf:
      - type: integer
      - type: string
    nullable: true
  ocr_lang:
    type: string
    nullable: true
  ocr_data:
    type: string
    nullable: true
  visible:
    type: string
    nullable: true
  public:
    type: string
    nullable: true
  fileId:
    type: integer
  galleryId:
    type: integer
  filesize:
    type: integer
    nullable: true
  filetype:
    type: string
    nullable: true
  user:
    type: string
    nullable: true
  lastModifUser:
    type: string
    nullable: true
  icon_fileId:
    type: integer
    nullable: true
  files:
    type: integer
    description: Number of files contained in this sub-gallery. Only present for gallery entries (isgal=1).
  parentName:
    type: string
    nullable: true
  perms:
    type: object
    description: Map of permission names to 'y'/'n'.
  wiki_syntax:
    type: string
    nullable: true
  podcast_filename:
    type: string
    nullable: true
  show_source:
    type: string
    nullable: true
    description: "Aliases the `tfg.show_source` column for galleries; empty string for plain files."
