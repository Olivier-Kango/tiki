---
type: object
description: All fields are optional. Only fields present in the request are changed; everything else is preserved from the existing article.
properties:
  title:
    type: string
    description: Article title
  heading:
    type: string
    description: Short introductory text shown above the body
  body:
    type: string
    description: Main article content
  topicId:
    type: integer
    description: Topic ID to assign the article to
  type:
    type: string
    description: Article type
  lang:
    type: string
    description: Language code of the article
  authorName:
    type: string
    description: Author name to display
  description:
    type: string
    description: Subtitle / short description of the article
  publishDate:
    type: integer
    description: Unix timestamp for the publish date
