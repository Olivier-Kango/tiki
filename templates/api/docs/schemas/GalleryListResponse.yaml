---
description: Paginated list of galleries and their files/sub-galleries.
type: object
properties:
  title:
    type: string
  parentId:
    type: integer
  offset:
    type: integer
  maxRecords:
    type: integer
  count:
    type: integer
  result:
    type: array
    items:
      description: |
        Same shape as File.yaml, plus the keys only guaranteed present when
        listing galleries (as opposed to listing the files within one gallery).
      allOf:
        - $ref: schemas-File.yaml
        - type: object
          required:
            - show_source
            - files
            - parentName
          properties:
            show_source:
              type: string
              nullable: true
            files:
              type: integer
            parentName:
              type: string
              nullable: true
