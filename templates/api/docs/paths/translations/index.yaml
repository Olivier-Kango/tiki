---
get:
  description: |
    List translations relation of an instance of an object type (eg: translations of a wiki page)
  parameters:
    - name: type
      in: path
      required: true
      description: |
        The Tiki object type. Possible values are:
        - `wiki page`, `forum`, `tracker`, `file gallery`, etc
      schema:
        type: string
    - name: source
      in: path
      required: true
      description: |
        The source object name. For example, if the type is `wiki page`, the source is the wiki page name.
      schema:
        type: string
  responses:
    '200':
      description: translations response
      content:
        application/json:
          schema:
            type: object
            properties:
              title:
                type: string
              type:
                type: string
              source:
                type: string
              filters:
                type: object
                properties:
                  type:
                    type: string
                  language:
                    type: string
                    nullable: true
                    description: Quoted OR-string of available language codes, or null when no other language exists.
              translations:
                type: array
                description: Translation links; empty when no translations are attached.
                items:
                  type: object
                  properties:
                    traId:
                      type: integer
                    objId:
                      type: string
                      description: Object identifier (page name for wiki pages, numeric ID for other types).
                    lang:
                      type: string
                      description: Language code (e.g. 'fr', 'de').
                    language:
                      type: string
                      description: Human-readable language name.
              canAttach:
                type: boolean
              canDetach:
                type: boolean
    '400':
      description: bad request
      content:
        application/json:
          schema:
            $ref: schemas-Error.yaml
    '403':
      description: forbidden
      content:
        application/json:
          schema:
            $ref: schemas-Error.yaml