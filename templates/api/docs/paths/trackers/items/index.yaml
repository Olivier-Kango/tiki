---
post:
  description: Create a tracker item
  parameters:
    - name: trackerId
      in: path
      required: true
      schema:
        type: integer
  requestBody:
    required: true
    description: Should contain an object of the field values with either field permanent names as keys or ins_FID keys.
    content:
      application/x-www-form-urlencoded:
        schema:
          type: object
          properties:
            fields[fieldPermanentName1]:
              type: string
              description: The value of the field 1
              default: "value1"
            fields[fieldPermanentName2]:
              type: string
              description: The value of the field 2
              default: "value2"
            fields[fieldPermanentName3]:
              type: integer
              description: The value of the field 3
              default: 123
          required:
            - fields[fieldPermanentName1]
            - fields[fieldPermanentName2]
            - fields[fieldPermanentName3]
  responses:
    '200':
      description: tracker item response
      content:
        application/json:
          schema:
            type: object
            properties:
              itemId:
                type: integer
              status:
                type: string
              fields:
                type: object
                description: Map of field permName to scalar value.
              itemTitle:
                type: string
              processedFields:
                type: object
                description: Map of permName to processed/formatted value.
              nextTicket:
                type: string
    '403':
      description: forbidden
      content:
        application/json:
          schema:
            $ref: schemas-Error.yaml
    '404':
      description: not found
      content:
        application/json:
          schema:
            $ref: schemas-Error.yaml