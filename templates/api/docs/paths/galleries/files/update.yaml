---
post:
  description: Update file
  parameters:
    - name: fileId
      in: path
      description: The file ID to update
      required: true
      schema:
        type: integer
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            data:
              type: file
              description: file path to upload. If omitted, the current file will remain unchanged.
            user:
              type: string
              description: The user who uploaded the file
            title:
              type: string
              description: The title of the file
            name:
              type: string
              description: The name of the file
            description:
              type: string
              description: The description of the file
  responses:
    '200':
      description: update file response
      content:
        application/json:
          schema:
            $ref: schemas-FileUploadResponse.yaml
    '403':
      description: forbidden
      content:
        application/json:
          schema:
            $ref: schemas-Error.yaml
    '503':
      description: unavailable
      content:
        application/json:
          schema:
            $ref: schemas-Error.yaml
