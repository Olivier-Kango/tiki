---
get:
  description: Retrieve file information
  parameters:
    - name: fileId
      in: path
      description: The file ID to retrieve
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: file info response
      content:
        application/json:
          schema:
            type: object
            properties:
              title:
                type: string
              fileId:
                type: integer
              info:
                $ref: schemas-File.yaml
    '403':
      description: forbidden
      content:
        application/json:
          schema:
            $ref: schemas-Error.yaml
