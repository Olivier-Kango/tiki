---
get:
  description: Get all galleries.
  parameters:
    - name: galleryId
      in: query
      description: The ID of the gallery
      required: false
      schema:
        type: integer
    - name: offset
      in: query
      description: The offset to start from
      required: false
      schema:
        type: integer
    - name: maxRecords
      in: query
      description: The maximum number of records to return
      required: false
      schema:
        type: integer
    - name: sort_mode
      in: query
      description: |
        The sort mode. Possible values are:
        - `created_desc`, `created_asc`, `name_desc`, `name_asc`
      required: false
      schema:
        type: string
    - name: user
      in: query
      description: The user (username) who created the gallery
      required: false
      schema:
        type: string
    - name: find
      in: query
      description: The search string to find galleries
      required: false
      schema:
        type: string
  responses:
    '200':
      description: gallery response
      content:
        application/json:
          schema:
            $ref: schemas-GalleryListResponse.yaml
post:
  description: Create a new Gallery.
  requestBody:
    required: true
    content:
      application/x-www-form-urlencoded:
        schema:
          type: object
          required:
            - name
          properties:
            name:
              type: string
              description: The name of the gallery
            type:
              type: string
              description: |
                The type of the gallery. Possible values are:
                - `default`
                - `podcast`
                - `vidcast`
                - `direct`
              enum:
                - default
                - podcast
                - vidcast
                - direct
            description:
              type: string
              description: The description of the gallery
            parentId:
              type: integer
              description: The parent ID of the gallery
  responses:
    '200':
      description: create gallery response
      content:
        application/json:
          schema:
            $ref: schemas-Gallery.yaml
    '403':
      description: forbidden
      content:
        application/json:
          schema:
            $ref: schemas-Error.yaml