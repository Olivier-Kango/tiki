---
get:
  description: Get all users
  parameters:
    - name: groupIds[]
      in: query
      required: false
      description: The group IDs to filter users by
      schema:
        type: array
        items:
          type: integer
    - name: offset
      in: query
      required: false
      description: The offset to start from
      schema:
        type: integer
    - name: maxRecords
      in: query
      required: false
      description: The maximum number of records to return
      schema:
        type: integer
  responses:
    '200':
      description: users response
      content:
        application/json:
          schema:
            type: object
            properties:
              result:
                type: array
                nullable: true
                description: Null when the caller lacks permission to list users.
                items:
                  type: object
                  properties:
                    userId:
                      type: integer
                    login:
                      type: string
                    default_group:
                      type: string
                      nullable: true
                    lastLogin:
                      type: integer
                      nullable: true
                    currentLogin:
                      type: integer
                      nullable: true
                    registrationDate:
                      type: integer
                    pass_confirm:
                      type: integer
                      nullable: true
                    email_confirm:
                      type: integer
                      nullable: true
                    created:
                      type: integer
                    valid:
                      type: string
                      nullable: true
                    unsuccessful_logins:
                      type: integer
                    waiting:
                      type: string
                      nullable: true
                    user:
                      type: string
                    groups:
                      type: array
                      items:
                        type: string
                    age:
                      type: integer
                    editable:
                      type: boolean
                    disposable_email:
                      type: boolean
                    avatar:
                      type: string
                      nullable: true
              count:
                type: integer
                nullable: true
                description: Null when the caller lacks permission to list users.
post:
  description: Register/create a user
  requestBody:
    required: true
    content:
      application/x-www-form-urlencoded:
        schema:
          type: object
          required:
            - name
            - pass
            - passAgain
          properties:
            name:
              type: string
              description: The user's name
            pass:
              type: string
              description: The user's password
            passAgain:
              type: string
              description: The user's password again. Must match the pass field. 
            email:
              type: string
              description: The user's email address
  responses:
    '200':
      description: user registration response
      content:
        application/json:
          schema:
            type: object
            properties:
              result:
                type: string
                nullable: true
                description: Confirmation message on successful registration.
    '422':
      description: validation error
      content:
        application/json:
          schema:
            $ref: schemas-Error.yaml
    '403':
      description: forbidden
      content:
        application/json:
          schema:
            $ref: schemas-Error.yaml