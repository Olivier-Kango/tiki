---
get:
  description: Retrieve user information
  parameters:
    - name: username
      in: path
      description: Username/Login/Email
      required: true
      schema:
        type: string
  responses:
    '200':
      description: user info response
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                description: Error message if information isn't visible.
              fullname:
                type: string
              gender:
                type: string
              starHtml:
                type: string
              country:
                type: string
              distance:
                type: string
              email:
                type: string
              lastSeen:
                type: string
                nullable: true
                description: Unix timestamp or formatted date string; null if not visible.
              avatarHtml:
                type: string
              shared_groups:
                type: string
              other_user:
                type: string
                nullable: true
              add_friend_button:
                type: string
                nullable: true
              friendship:
                type: array