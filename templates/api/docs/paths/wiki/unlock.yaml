---
post:
  description: Unlock pages
  requestBody:
    required: true
    content:
      application/x-www-form-urlencoded:
        schema:
          type: object
          properties:
            items[]:
              type: array
              description: The array of page names to unlock
              items:
                type: string
  responses:
    '200':
      description: unlock pages response
      content:
        application/json:
          schema:
            $ref: schemas-RefreshFeedbackResponse.yaml
    '403':
      description: forbidden
      content:
        application/json:
          schema:
            $ref: schemas-Error.yaml
