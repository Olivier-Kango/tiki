---
get:
  description: Retrieve full tracker import-export information.
  parameters:
    - name: tabularId
      in: path
      description: Import-Export ID
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: tracker import-export
      content:
        application/json:
          schema:
            type: object
            properties:
              title:
                type: string
              tabularId:
                type: integer
              trackerId:
                type: integer
              name:
                type: string
              config:
                type: object
                properties:
                  simple_headers:
                    type: integer
                  import_update:
                    type: integer
                  ignore_blanks:
                    type: integer
                  import_transaction:
                    type: integer
                  bulk_import:
                    type: integer
                  skip_unmodified:
                    type: integer
                  encoding:
                    type: string
                  format:
                    type: string
                  mapping:
                    type: string
              odbc_config:
                type: object
              api_config:
                type: object
              columns:
                type: array
                items:
                  type: object
                  properties:
                    label:
                      type: string
                    field:
                      type: string
                    mode:
                      type: string
                    displayAlign:
                      type: string
                    isPrimary:
                      type: boolean
                    isReadOnly:
                      type: boolean
                    isExportOnly:
                      type: boolean
                    isUniqueKey:
                      type: boolean
              filters:
                type: array
              has_odbc:
                type: boolean
              encodings:
                type: array
    '403':
      description: forbidden
      content:
        application/json:
          schema:
            $ref: schemas-Error.yaml
