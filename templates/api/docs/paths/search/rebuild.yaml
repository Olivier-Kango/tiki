---
post:
  description: Run search index rebuild
  parameters:
    - name: loggit
      in: query
      required: false
      description: |
        Log index rebuild process to file
        - `0`: no logging
        - `1`: log to Search_Indexer.log
        - `2`: log to Search_Indexer_console.log
      schema:
        type: integer
  responses:
    '200':
      description: process queue result
      content:
        application/json:
          schema:
            type: object
            properties:
              title:
                type: string
              formattedStats:
                type: string
                nullable: true
              search_engine:
                type: string
              search_version:
                type: string
              search_index:
                type: string
              fallback_search_engine:
                type: string
              fallback_search_version:
                type: string
              fallback_search_index:
                type: string
              queue_count:
                type: integer
              log_file_browser:
                type: string
              fallback_log_file_browser:
                type: string
              log_file_console:
                type: string
              fallback_log_file_console:
                type: string
              lastLogItemWeb:
                type: string
              lastLogItemConsole:
                type: string
              isAjax:
                type: boolean
              showForm:
                type: boolean
              unified_last_rebuild:
                type: integer
    '403':
      description: forbidden
      content:
        application/json:
          schema:
            $ref: schemas-Error.yaml