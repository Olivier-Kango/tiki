post:
  description: Uncategorize one or more objects from a specific category
  requestBody:
    required: true
    content:
      application/x-www-form-urlencoded:
        schema:
          type: object
          properties:
            categIds[]:
              type: array
              description: Category identifiers. An array of category IDs to uncategorize the objects from
              items:
                type: integer
            objects[]:
              $ref: schemas-TikiObjects.yaml
  responses:
    '200':
      description: uncategorize response
      content:
        application/json:
          schema:
            type: object
            properties:
              categId:
                type: string
                description: Category ID (may be returned as a string).
              objects:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    id:
                      type: string
                    catObjectId:
                      type: string
              count:
                oneOf:
                  - type: integer
                  - type: string
                description: Number of objects remaining in the category, or 'unchanged' when no update was performed.
    '403':
      description: forbidden
      content:
        application/json:
          schema:
            $ref: schemas-Error.yaml
