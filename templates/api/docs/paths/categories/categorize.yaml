post:
  description: Categorize one or more objects under a specific category
  requestBody:
    required: true
    content:
      application/x-www-form-urlencoded:
        schema:
          type: object
          required:
            - categIds
            - objects
          properties:
            categIds[]:
              type: array
              description: Category identifiers. An array of category IDs to categorize the objects under
              items:
                type: integer
            objects[]:
              $ref: schemas-TikiObjects.yaml
  responses:
    '200':
      description: categorize response
      content:
        application/json:
          schema:
            oneOf:
              - $ref: schemas-CategorizeSingleCateg.yaml
              - $ref: schemas-CategorizeMultiCateg.yaml
    '403':
      description: forbidden
      content:
        application/json:
          schema:
            $ref: schemas-Error.yaml
