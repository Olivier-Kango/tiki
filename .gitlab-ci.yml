    - echo "GRANT ALL ON tikiold.* TO '${MYSQL_USER}';" | mysql -u root --password=$MYSQL_ROOT_PASSWORD -h ${MYSQL_SERVICE_ALIAS}
    - echo "GRANT ALL ON tikinew.* TO '${MYSQL_USER}';" | mysql -u root --password=$MYSQL_ROOT_PASSWORD -h ${MYSQL_SERVICE_ALIAS}
    - php -d display_errors=On doc/devtools/check_sql_engine_conversion.php --db1=$MYSQL_USER:$MYSQL_PASSWORD@${MYSQL_SERVICE_ALIAS}:tikiold --db2=$MYSQL_USER:$MYSQL_PASSWORD@${MYSQL_SERVICE_ALIAS}:tikinew
    - echo "SHOW CREATE DATABASE tikiold" | mysql -u root --password=$MYSQL_ROOT_PASSWORD -h ${MYSQL_SERVICE_ALIAS}
    - echo "SHOW CREATE DATABASE tikinew" | mysql -u root --password=$MYSQL_ROOT_PASSWORD -h ${MYSQL_SERVICE_ALIAS}
    - mysqldump --column-statistics=0 -u root --password=$MYSQL_ROOT_PASSWORD -h ${MYSQL_SERVICE_ALIAS} tikiold > tikiold.sql
    - mysqldump --column-statistics=0 -u root --password=$MYSQL_ROOT_PASSWORD -h ${MYSQL_SERVICE_ALIAS} tikinew > tikinew.sql
  artifacts:
    paths:
      - tikiold.sql
      - tikinew.sql
    expire_in: 2 days
    when: always

check-custom-folder:
  stage: tiki-check
  needs: []
  script:
    - echo "Changes in the _custom directory are not allowed to merge into mainstream."
    - exit 1
  rules:
    - if: $CI_PROJECT_PATH == $PROJECT_PATH && $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "_custom/**/*"
      when: always

# This will mostly catch composer platform-check problems.
console-php-works:
  stage: tiki-check
  needs:
      - composer
  image: ${DEPENDENCY_PROXY_PREFIX}${BASE_QA_IMAGE}
  script:
    - php console.php

#
# Unit Tests
#

.template-unit-tests:
  stage: unit-tests
  needs:
    - composer
  image: ${DEPENDENCY_PROXY_PREFIX}tikiwiki/tikiwiki-ci:${PHP_VERSION}-qa
  variables:
    EXTRA: 1
    MCL: 1
    # This allows concurrent jobs on the same runner not to interfere with one another.
    # These aliases must remain within 15 characters and not start with a number (on docker linux). 
    # So with the id being up to 7 characters, it means no more than 8 in the prefix.
    # Rejected approach: Set FF_NETWORK_PER_BUILD globally.  WOuld be perfect, expcept I couldn't get dns resolution to work on the build host. - benoitg - 2026-07-27
    MYSQL_SERVICE_ALIAS: mysql-${CI_JOB_ID}
    ELASTICSEARCH_SERVICE_ALIAS: elastic-${CI_JOB_ID}
    MANTICORE_SERVICE_ALIAS: manti-${CI_JOB_ID}
  services:
    - name: ${DEPENDENCY_PROXY_PREFIX}${DB_IMAGE}
      alias: ${MYSQL_SERVICE_ALIAS}
      command: ["--explicit-defaults-for-timestamp=off"]
    - name: ${DEPENDENCY_PROXY_PREFIX}${ELASTICSEARCH_IMAGE_NEWEST_SUPPORTED}
      alias: ${ELASTICSEARCH_SERVICE_ALIAS}
    - name: ${DEPENDENCY_PROXY_PREFIX}${MANTICORE_IMAGE_NEWEST_SUPPORTED}
      alias: ${MANTICORE_SERVICE_ALIAS}
  script:
    - 'echo -n "PHP Version: " && php -v | grep "^PHP"'
    - 'echo -n "MySQL/MariaDB Version: " && mysql -u root --password=$MYSQL_ROOT_PASSWORD -h ${MYSQL_SERVICE_ALIAS} --skip-column-names -B -e "SELECT VERSION()" 2>/dev/null'
    - 'echo -n "ElasticSearch Version: " && curl -sS -XGET http://${ELASTICSEARCH_SERVICE_ALIAS}:9200 | grep ''"number"'' | sed ''s/.*:.*"\(.*\)".*/\1/'''
    - 'echo -n "Manticore Version: " && mysql -h ${MANTICORE_SERVICE_ALIAS} -P 9306 -e "status" | grep "Server version:" | sed "s/^[^:]*:[[:space:]]*//"'
    - echo '<?php $host_tiki = "'${MYSQL_SERVICE_ALIAS}'"; $user_tiki = "tikiuser"; $pass_tiki = "tikipass"; $dbs_tiki = "tikitest"; $client_charset = "utf8mb4"; ' > lib/test/local.php
    - php console.php smarty:generate-mapping
    - php -d display_errors=On vendor_bundled/vendor/phpunit/phpunit/phpunit $PHPUNIT_EXTRA_PARAMS --log-junit temp/ci/phpunit-report.xml --display-deprecations --display-notices --display-warnings

unit-tests-php-latest-with-coverage:
  #We only generate one coverage report, for the lastest PHP.  Gitlab won't properly process if more than one parallel run has coverage artifacts.
  extends: .template-unit-tests
  allow_failure: false
  variables:
    XDEBUG_MODE: coverage
    PHPUNIT_EXTRA_PARAMS: --coverage-cobertura temp/ci/phpunit-coverage.xml --coverage-text --colors=never
  artifacts:
    when: always
    paths:
      # This is needed for php-gitlab-coverage to massage it for gitlab
      - temp/ci/phpunit-coverage.xml
    reports:
      junit: temp/ci/phpunit-report.xml
  coverage: '/^\s*Lines:\s*\d+.\d+\%/'
  parallel:
    matrix:
      - PHP_VERSION: "8.5"
        DB_IMAGE: ${MARIADB_IMAGE_NEWEST_SUPPORTED}

unit-tests-php-previousVersions:
  extends: .template-unit-tests
  allow_failure: false
  parallel:
    matrix:
      - PHP_VERSION: "8.4"
        DB_IMAGE: ${MYSQL_IMAGE_NEWEST_SUPPORTED}
      - PHP_VERSION: "8.3"
        DB_IMAGE: ${MARIADB_IMAGE_COMMON_LTS}
      - PHP_VERSION: "8.2"
        DB_IMAGE: ${MYSQL_IMAGE_OLDEST_SUPPORTED}
      - PHP_VERSION: "8.1"
        DB_IMAGE: ${MARIADB_IMAGE_OLDEST_SUPPORTED}

# This job is needed beause of the 10MB gitlab limitation when processing cobertura xml files to 
# show line by line coverage in diffs.
# https://gitlab.com/gitlab-org/gitlab/-/work_items/328772
# That limitation is silent, making it very hard to notice and debug..
generate-gitlab-line-coverage-php:
  stage: unit-tests
  needs:
    - unit-tests-php-latest-with-coverage
  image: 
    name: ${DEPENDENCY_PROXY_PREFIX}${BASE_QA_IMAGE}
  script:
    # Yes this is is a very bad idea for supply chain attacks.  But ironically because of:
    # https://gitlab.com/gitlab-org/gitlab-runner/-/work_items/26501 and related bugs, we cannot use 
    # the cobertura_split distroless docker image, despite wasting hours (gitlab keeps trying to inject the shell as an extra postional parameter.
    # Since this is a gitlab-specific workaround and this step generates no executable artifacts, 
    # and we are moving to forgejo, this is acceptable.
    # Rejected (but attempted) alternative:
    # Use gitlab native step runners to hack this.  Not supported by gitlab-ci-local so not workable.
    # Use dind:  Requires privileged runners, and once we start dowan that path...
    # Other rejecte approach:
    # Build  cobertura_split each pipeline from source.  Slow and expensive in pipeline minutes.  And just as susceptible to supply chain attacks as this, and creates the same dependenci to github.
    # So there we go.  - benoitg  2026-07-28
    - curl -L -o cobertura_split https://github.com/mike-kfed/lcov2cobertura/releases/download/1.0.9/cobertura_split-x86_64-unknown-linux-musl
    - chmod +x cobertura_split
    - ./cobertura_split ${CI_PROJECT_DIR}/temp/ci/phpunit-coverage.xml
    - echo "Generated files:"
    - ls -lah ${CI_PROJECT_DIR}/temp/ci/phpunit-coverage-*.xml
  artifacts:
    #paths:
      # This is only needed if you want to inspect the artifacts in gitlab's pipeline interface, the reports will compute without it.
      #- temp/ci/phpunit-coverage-*.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        #cobertura_split will generate files appending numbers, such as phpunit-coverage-1.xml
        path: temp/ci/phpunit-coverage-*.xml

unit-tests-node:
  stage: unit-tests
  needs:
    - node_modules
  image:
    name: ${DEPENDENCY_PROXY_PREFIX}${NODE_IMAGE}
  script:
    - npm run testci
  coverage: '/All files(?:[^|]*\|){4}\s*(\S+)/'
  artifacts:
    when: always
    #paths:
      # This is only needed if you want to inspect the artifacts in gitlab's pipeline interface, the reports will compute without it.
      #- temp/ci/js_coverage/cobertura-coverage.xml
    reports:
      junit: temp/ci/js-junit-report.xml
      coverage_report:
        coverage_format: cobertura
        path: temp/ci/js_coverage/cobertura-coverage.xml

# This test is only required because we don't have a combined node and php image currently. - benoitg - 2025-03-08
unit-tests-icon-generator:
  stage: unit-tests
  needs:
    - composer
    - node_modules
  image:
    name: ${DEPENDENCY_PROXY_PREFIX}${BASE_QA_IMAGE}
  script:
    - php console.php build:generateiconlist

# End-to-end browser tests (Playwright) — fully self-contained:
# provisions a disposable Tiki (dedicated test database + schema install) and
# serves it with PHP's built-in web server, so no pre-existing instance is
# needed. See tests/e2e/README.md.
# All jobs are manual + allow_failure while runtimes are validated on shared
# runners; promote to automatic once stable. `e2e-all` runs every suite;
# the `e2e-suite` matrix offers one play button per domain.
.e2e-base:
  stage: e2e-tests
  needs:
    - composer
    - node_modules
    # node_build artifacts provide public/generated/ (JS bundles + CSS) —
    # without them Bootstrap JS 404s and every tab/modal interaction times out.
    - node_build
  when: manual
  allow_failure: true
  # Official Playwright image (Node + browsers); version must match the
  # @playwright/test devDependency in the root package.json.
  image: ${DEPENDENCY_PROXY_PREFIX}mcr.microsoft.com/playwright:v1.58.2-noble
  services:
    - name: ${DEPENDENCY_PROXY_PREFIX}${MARIADB_IMAGE_COMMON_LTS}
      alias: mysql
      command: ["--explicit-defaults-for-timestamp=off"]
  variables:
    TIKI_E2E_WEBSERVER: "1"
    TIKI_E2E_DB_HOST: mysql
    TIKI_E2E_DB_NAME: ${MYSQL_DATABASE}
    TIKI_E2E_DB_USER: ${MYSQL_USER}
    TIKI_E2E_DB_PASS: ${MYSQL_PASSWORD}
  script:
    # php-bcmath is required by teqneers/shamir (Secret::share) — shared-secrets
    # key creation fatals without it, silently skipping the fixture-based suites.
    - apt-get update -qq && apt-get install -y -qq php-cli php-mysql php-xml php-mbstring php-zip php-gd php-intl php-curl php-bcmath > /dev/null
    - 'echo -n "PHP Version: " && php -v | grep "^PHP"'
    - tests/e2e/bin/e2e-provision.sh
    - npx playwright install chromium
    # E2E_SUITE selects one domain (empty = all suites). Anchored to suites/<domain>/
    # because the bare name is a regex over the full path and could over-match.
    - npx playwright test --config=tests/e2e/playwright.config.ts ${E2E_SUITE:+suites/${E2E_SUITE}/}
  after_script:
    # PHP server output goes to a file (see playwright.config.ts) to keep the
    # job log under GitLab's 4MB limit; surface fatals here for quick triage.
    - grep -E 'PHP (Fatal|Parse) error' tests/e2e/php-server.log | tail -20 || true
  artifacts:
    when: always
    paths:
      - tests/e2e/playwright-report
      - tests/e2e/php-server.log
    expire_in: 2 days

e2e-all:
  extends: .e2e-base

# One manual job per domain. Adding a new domain to the matrix list is the
# only change needed here after `mkdir tests/e2e/suites/<domain>/`.
e2e-suite:
  extends: .e2e-base
  parallel:
    matrix:
      - E2E_SUITE:
          - smoke
          - shared-secrets
          - wiki-pages

#
# Package this Tiki build
#

.tiki-package-changelog-script: &tiki-package-changelog-script |
  echo "=> Generate changelog ..."
  TARGET_BRANCH="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-$CI_DEFAULT_BRANCH}"
  git fetch origin "$TARGET_BRANCH" --tags --depth=1000
  LAST_TAG=$(git tag --sort=-v:refname | head -n 1)
  git merge-base --is-ancestor "$LAST_TAG" "origin/$TARGET_BRANCH" || git fetch --unshallow
  php doc/devtools/generate_changelog.php --range="$LAST_TAG..origin/$TARGET_BRANCH"
  mv generated_changelog.md CHANGELOG.generated.md

.tiki-package-base: &tiki-package-base
  stage: package-tiki
  needs:
    - composer
    - node_build
  image: ${DEPENDENCY_PROXY_PREFIX}${BASE_QA_IMAGE}
  cache: [*cache-composercache]
  allow_failure: true
  artifacts:
    paths:
      - tiki-${CI_COMMIT_SHORT_SHA}-${CI_COMMIT_REF_SLUG}.tar.gz
    expire_in: 2 days

# 1. SHALLOW PACKAGING: Fast because it uses a depth of 1 and doesn't need to fetch all tags.'
tiki-package-shallow:
  <<: *tiki-package-base
  variables:
    GIT_DEPTH: "1"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_EVENT_TYPE != "merge_train"'
      when: always
    - when: never
  script:
    - PACKAGE_FILENAME="tiki-${CI_COMMIT_SHORT_SHA}-${CI_COMMIT_REF_SLUG}.tar.gz" src/ci/build_package.sh

# 2. DEEP PACKAGING: Slower because it needs to fetch all tags and apply only on merge requests to the master branch.
tiki-package-deep:
  <<: *tiki-package-base
  variables:
    GIT_DEPTH: "1000"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_EVENT_TYPE == "merge_train" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^\d+\.x$/)'
      when: always
    - if: '$CI_PROJECT_PATH == "tikiwiki/tiki" && $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH =~ /^\d+\.x$/)'
      when: always
    - when: never
  script:
    - *tiki-package-changelog-script
    - PACKAGE_FILENAME="tiki-${CI_COMMIT_SHORT_SHA}-${CI_COMMIT_REF_SLUG}.tar.gz" src/ci/build_package.sh
  artifacts:
    paths:
      - tiki-${CI_COMMIT_SHORT_SHA}-${CI_COMMIT_REF_SLUG}.tar.gz
      - CHANGELOG.generated.md
    expire_in: 2 days

check-directories:
  stage: package-tiki
  needs:
    - composer
  image: ${DEPENDENCY_PROXY_PREFIX}${BASE_QA_IMAGE}
  script:
    - php console.php dev:buildwsconfs --generate
    - php console.php dev:buildwsconfs

# Vendors Security
#

#disabled, showld be generated from /lib/core/Tiki/Package/ComposerPackages.yml
.vendor-security-check:
  stage: vendors-security
  needs:
    - composer
  image: ${DEPENDENCY_PROXY_PREFIX}${BASE_QA_IMAGE}
  script:
    - composer -V | grep "version 2" || composer self-update --2
    - cp composer.json.dist composer.json
    # These are packages frequently installed with tiki, but not distributed with it
    # This should be generated from /lib/core/Tiki/Package/ComposerPackages.yml
    # It wasn't automated before, and I don't know how we were supposed to get some of these packages locally.  php console.php package:list can generate the list, but I can find no command to install them all - benoitg - 2023-05-04
    - composer require jerome-breton/casperjs-installer:dev-master --no-progress
    - composer require enygma/expose:^3.0 --no-progress
    - composer require fakerphp/faker dev-master --no-progress
    - composer require google/apiclient ^2.2.2 --no-progress
    - composer require mpdf/mpdf ^8.0.0 --no-progress
    - composer require xorti/mxgraph-editor ^3.9.12.2 --no-progress
    - composer require tikiwiki/diagram ^10 --no-progress
    - composer require thiagoalessio/tesseract_ocr ^2.7.0 --no-progress
    - composer require mathjax/mathjax ^2.7 --no-progress
    - composer require tikiwiki/media-alchemyst ^4.2 --no-progress
    - composer require npm-asset/pdfjs-dist ~2.0.487 --no-progress
    - composer require bower-asset/wodo.texteditor ^0.5.9 --no-progress
    - composer require j0k3r/php-readability ^1.1.10 --no-progress
  allow_failure: false
  only:
    refs:
      - schedules
    variables:
      - $SCHEDULER == "vendor_check"

vendor-bundled-security-check:
  stage: vendors-security
  needs:
    - composer
  image: ${DEPENDENCY_PROXY_PREFIX}${BASE_QA_IMAGE}
  script:
    - composer -V | grep "version 2\.[6-9]" || composer self-update 2.6.3
    - cd vendor_bundled
    - composer audit --locked --no-dev
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "vendor_bundled/composer.json"
        - "vendor_bundled/composer.lock"
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULER == "vendor_check"

update_vendor_bundled_dependencies:
  stage: vendors_update
  needs:
    - composer
  image: ${DEPENDENCY_PROXY_PREFIX}${BASE_QA_IMAGE}
  variables:
    BRANCH_NAME: "${CI_COMMIT_REF_NAME}_vendor_bundled_update"
    COMMIT_MESSAGE: "[UPD] Update ${CI_COMMIT_REF_NAME} vendor_bundled dependencies"
    CI_REPOSITORY_URL: "https://${GITLAB_USER_LOGIN}:${GITLAB_USER_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
    COMPOSER_DISCARD_CHANGES: "true"
    COMPOSER_NO_INTERACTION: "1"
  before_script:
    - git config --global user.email "${GITLAB_USER_EMAIL}"
    - git config --global user.name "${GITLAB_USER_NAME}"
  script:
    - composer -V | grep "version 2" || composer self-update --2
    - DATE=`date +%Y%m%d`
    - BRANCH_NAME="${BRANCH_NAME}_${DATE}"
    - php doc/devtools/update_vendor_bundled.php
    - if git diff --quiet --exit-code vendor_bundled/composer.lock; then exit 0; fi;
    - if git rev-parse --verify ${BRANCH_NAME}; then git branch -D ${BRANCH_NAME}; fi;
    - git checkout -b ${BRANCH_NAME}
    - git add vendor_bundled/composer.lock
    - git commit -m "${COMMIT_MESSAGE}"
    - git push ${CI_REPOSITORY_URL} HEAD:${BRANCH_NAME} --quiet
    - |
      HOST=${CI_PROJECT_URL} CI_PROJECT_ID=${CI_PROJECT_ID} SOURCE_BRANCH=${BRANCH_NAME} TARGET_BRANCH=${CI_COMMIT_REF_NAME} GITLAB_USER_ID=${GITLAB_USER_ID} PRIVATE_TOKEN=${GITLAB_USER_TOKEN} TARGET_PROJECT_ID=${TARGET_PROJECT_ID} SET_MERGE=${SET_MERGE} \
      /bin/bash ./doc/devtools/gitlab/auto_merge_request.sh "${COMMIT_MESSAGE} (${DATE})"
  only:
    refs:
      - schedules
    variables:
      - $SCHEDULER == "update_vendor_bundled"

composer-stability:
  stage: composer-stability
  image: ${DEPENDENCY_PROXY_PREFIX}${BASE_QA_IMAGE}
  needs:
    - composer
  script:
    - php doc/devtools/check_composer_stability.php --ci
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: always
    - when: manual
  artifacts:
    when: always  # Always upload artifacts even if job fails
  allow_failure: true  # Allow job to fail without failing the pipeline

composer-operator-check:
  stage: composer-stability
  image: ${DEPENDENCY_PROXY_PREFIX}${BASE_QA_IMAGE}
  needs:
    - composer
  script:
    - php doc/devtools/check_caret_operator.php

check-alphabetical-list:
  stage: unit-tests
  image: ${DEPENDENCY_PROXY_PREFIX}${BASE_QA_IMAGE}
  needs:
    - composer
  script:
    - php doc/devtools/check_alphabetical_list.php
  allow_failure: false
